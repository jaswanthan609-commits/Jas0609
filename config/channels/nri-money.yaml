# Channel B: Money for NRIs (English, NRIs in US/UK/Gulf). Education only, no specific buy/sell advice.
name: "NRI Money Guide"
niche: "money for Indians living abroad: NRE/NRO accounts, sending money home, taxes in both countries, investing in India from abroad"
language: en
audience: "Indians working in the US, UK, Canada, Australia and the Gulf"
tone: "calm, precise, trustworthy, explains rules step by step"
voice_provider: edge       # free; switch to elevenlabs when income covers it
fallback_voice: ""         # set an Edge voice here if you switch voice_provider to kokoro
voice: en-IN-PrabhatNeural
stock_sources: [pexels, pixabay]
extra_guidelines: |
  Stick to evergreen how-to topics (opening an NRE account, filing as an NRI, sending money home),
  not this year's budget news. For every item in facts_to_check, add the official source to check
  it against in brackets, e.g. (incometax.gov.in), (rbi.org.in), (irs.gov), (gov.uk/hmrc).
  If you can't name an official source for a claim, leave the claim out.
research_queries: ["nri tax", "nre nro account", "send money to india", "nri investment india"]   # YouTube searches for breakout research
default_tags: ["nri", "nri finance", "nre account", "send money to india"]
category_id: "27"              # Education
publish_times: ["20:30"]
monthly_target_inr: 110000

# --- $50 fast-track budget profile (switch back to elevenlabs / claude-opus-5-5 once it earns) ---
claude_model: claude-sonnet-5-5
claude_model_short: claude-haiku-5-5

