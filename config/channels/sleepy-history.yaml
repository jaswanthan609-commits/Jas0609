# Channel D: calm 30-minute history videos to fall asleep to (English, global).
# Runs from day 1: long calm videos build watch hours fastest (see config/autopilot.yaml).
name: "Slow History for Sleep"
niche: "gentle, detailed walk-throughs of everyday life in history: a day in ancient Rome, medieval villages, the Silk Road, old lighthouses"
language: en
audience: "adults in the US, UK, Canada and Australia who listen to calm long videos to fall asleep or relax"
tone: "soft, slow, warm, descriptive, never dramatic"
voice_provider: edge       # free; a calm ElevenLabs voice is the first upgrade once it earns
fallback_voice: ""         # set an Edge voice here if you switch voice_provider to kokoro
voice: en-GB-RyanNeural
voice_rate: 0.85
long_format: deep          # 30-minute videos
stock_sources: [pexels, pixabay]
music_volume: 0.18
research_queries: ["history for sleep", "boring history to fall asleep", "sleep story history"]   # YouTube searches for breakout research
default_tags: ["history for sleep", "sleep story", "boring history", "relaxing history", "fall asleep"]
category_id: "27"          # Education
publish_times: ["21:30"]   # IST; evening in Europe, afternoon in the US
extra_guidelines: |
  Every fact must be well established; add each date, number and claim to facts_to_check.
  Describe sights, sounds and routines so listeners can picture them. No violence in detail.
  Pick visual_query terms that stock libraries have: landscapes, candles, old streets, ruins, rivers.

claude_model: claude-sonnet-5-5

# Amazon Associates links (amazon.com), added to matching descriptions with a disclosure.
# Paste in your tagged links after signing up. Empty urls are skipped.
affiliate_links:
  - label: "Listen to history audiobooks free with an Audible trial"
    url: ""
    always: true
  - label: "A readable history of ancient Rome (book)"
    url: ""
    keywords: ["rome", "roman"]
  - label: "A history of medieval life (book)"
    url: ""
    keywords: ["medieval", "middle ages", "castle", "village"]
