# The self-funding autopilot. GitHub runs `python -m facepipe autopilot` every morning: it works out
# how much money is left, keeps a steady pace, and drafts only what today's budget allows.
#
# Money left = starting_budget_usd + reinvest_share x ad revenue earned since `started` - money spent.
# Spending is logged in ledger/spend.jsonl; earnings come from YouTube Analytics every Monday.
# Also set a hard monthly spend limit in the Anthropic Console as a safety net.

started: 2026-11-04
starting_budget_usd: 70        # the one-time budget (about Rs 7,000)
reinvest_share: 1.0            # share of earnings the autopilot may spend (1.0 = all of it)
runway_days: 60                # spread the money left over this many days, so it never runs out at once
usd_inr: 88
image_usd: 0.07                # estimated cost of one AI illustration (kids channel)

# Order matters: when money is tight, channels lower in the list are skipped first,
# and a channel's long video is dropped before its Short.
#
# Revised plan (2026-11-04): from 1 Feb 2027 YouTube needs 8,000 watch hours before it pays ads,
# so the line-up is built for watch hours, not volume. Three long videos a week per channel
# (fewer, better videos also keep clear of the "mass-produced" rule). Shorts are trailers only.
# No earnings gates: there is no ad money before Partner Program approval, so gates would never open.
channels:
  # Long calm videos build watch hours fastest (people watch 20+ minutes at a time).
  - slug: sleepy-history
    long_days: [mon, wed, fri]
    short_days: []
    est_long_usd: 0.30

  # Best ad rates of the line-up; few English faceless rivals.
  - slug: nri-money
    long_days: [tue, thu, sat]
    short_days: [tue, sat]     # trailers for the long videos
    est_long_usd: 0.12
    est_short_usd: 0.01

  # Paused until the pipeline can record screens by itself: stock clips of laptops make
  # useless tutorials. Set paused: false to restart it.
  - slug: ai-tools
    paused: true
    long_days: [mon, wed, fri]
    short_days: []
    est_long_usd: 0.12
    est_short_usd: 0.01

  # kids-stories is dropped from the autopilot: Made for Kids earns the least per view, AI kids
  # content is under the heaviest scrutiny, and each video costs ~18x the others. Its config stays
  # in config/channels/ in case you ever run it by hand.
