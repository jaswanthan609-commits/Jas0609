# When drafts are merged to main: render every approved script and (once enabled) upload it to
# YouTube into the next free publish slot. Videos are also kept as a downloadable artifact for 7
# days, so you can upload by hand while the YouTube API audit is pending.
name: Render and publish

on:
  push:
    branches: [main]
    paths: ["output/**/script.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - run: pip install -r requirements.txt

      - name: Write YouTube credentials
        env:
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          TOKEN_AI_TOOLS: ${{ secrets.YT_TOKEN_AI_TOOLS }}
          TOKEN_NRI_MONEY: ${{ secrets.YT_TOKEN_NRI_MONEY }}
          TOKEN_KIDS_STORIES: ${{ secrets.YT_TOKEN_KIDS_STORIES }}
        run: |
          mkdir -p tokens
          [ -n "$CLIENT_SECRET" ] && printf '%s' "$CLIENT_SECRET" > client_secret.json
          [ -n "$TOKEN_AI_TOOLS" ] && printf '%s' "$TOKEN_AI_TOOLS" > tokens/ai-tools.json
          [ -n "$TOKEN_NRI_MONEY" ] && printf '%s' "$TOKEN_NRI_MONEY" > tokens/nri-money.json
          [ -n "$TOKEN_KIDS_STORIES" ] && printf '%s' "$TOKEN_KIDS_STORIES" > tokens/kids-stories.json
          true

      - name: Render and upload approved scripts
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: |
          # Set the repository variable UPLOAD_ENABLED=true once YouTube tokens are added.
          if [ "${{ vars.UPLOAD_ENABLED }}" = "true" ]; then
            python -m facepipe publish-approved --all --upload --schedule
          else
            python -m facepipe publish-approved --all
          fi

      - name: Keep the videos for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            output/*/*/video.mp4
            output/*/*/thumbnail.jpg
            output/*/*/metadata.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Record what was published
        if: always()
        run: |
          git config user.name "facepipe-bot"
          git config user.email "facepipe-bot@users.noreply.github.com"
          git add -f output/*/*/metadata.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "Record published videos [skip ci]" && git push; }
