# Every morning: Claude drafts whatever today's budget allows and opens a pull request.
# Your only job: read the PR on your phone, delete any script you don't like, and merge.
# Merging is the approval; publish.yml then renders and uploads the merged scripts.
name: Daily drafts

on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: drafts
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Draft what today's budget allows
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # config/autopilot.yaml decides which channels draft today, from the money left.
        run: python -m facepipe autopilot

      - name: Save the spending ledger to main
        if: always()
        run: |
          git config user.name "facepipe-bot"
          git config user.email "facepipe-bot@users.noreply.github.com"
          git add ledger/ 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "Spending ledger $(date -u +%Y-%m-%d) [skip ci]" && git push origin HEAD:main; }

      - name: Open the review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          branch="drafts/$(date -u +%Y-%m-%d)"
          git checkout -b "$branch"
          git add -f output/*/*/script.json output/*/*/topic.txt topics/
          if git diff --cached --quiet; then echo "Nothing drafted today"; exit 0; fi
          git commit -m "Drafts for $(date -u +%Y-%m-%d)"
          git push -u origin "$branch"
          python - > body.md <<'PY'
          import json, pathlib, subprocess
          files = subprocess.run(["git", "diff", "--name-only", "HEAD~1", "--", "output"], capture_output=True, text=True).stdout.split()
          print("Merge to approve: every script here gets rendered and uploaded. Delete a script's folder first to reject it.\n")
          for f in sorted(f for f in files if f.endswith("script.json")):
              s = json.loads(pathlib.Path(f).read_text(encoding="utf-8"))
              print(f"### {s['title']}\n`{f}`\n")
              print("Facts to check:")
              for fact in s.get("facts_to_check", []) or ["(none listed)"]:
                  print(f"- [ ] {fact}")
              print()
          PY
          gh pr create --base main --head "$branch" --title "Drafts for $(date -u +%Y-%m-%d)" --body-file body.md
