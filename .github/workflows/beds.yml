# Probes candidate real rain and fire recordings for Cozy Hours: reads each licence on the item's own page,
# downloads the preview and has earshot judge it. Report in the run summary and the "beds-probe" artifact.
name: Beds probe

on:
  push:
    paths: ["scripts/beds_probe.py", ".github/workflows/beds.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EARSHOT_HOME: ${{ github.workspace }}/.earshot
      EARSHOT_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install earshot (pinned)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "earshot @ git+https://github.com/Leonxlnx/earshot@591fa3e028032e6dce56620a20e932e35667e8d8"
      - uses: actions/cache@v4
        with:
          path: .earshot
          key: earshot-models-591fa3e
      - run: earshot doctor --fetch
      - run: python -I scripts/beds_probe.py probe | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beds-probe
          path: probe/
          retention-days: 14
