# Every Monday: last 28 days of views, watch hours, revenue and RPM against each channel's target,
# shown on the workflow run's summary page.
name: Weekly stats

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  stats:
    if: ${{ vars.UPLOAD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Report
        env:
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          TOKEN_AI_TOOLS: ${{ secrets.YT_TOKEN_AI_TOOLS }}
          TOKEN_NRI_MONEY: ${{ secrets.YT_TOKEN_NRI_MONEY }}
          TOKEN_KIDS_STORIES: ${{ secrets.YT_TOKEN_KIDS_STORIES }}
        run: |
          mkdir -p tokens
          printf '%s' "$CLIENT_SECRET" > client_secret.json
          printf '%s' "$TOKEN_AI_TOOLS" > tokens/ai-tools.json
          printf '%s' "$TOKEN_NRI_MONEY" > tokens/nri-money.json
          printf '%s' "$TOKEN_KIDS_STORIES" > tokens/kids-stories.json
          { echo '```'; python -m facepipe stats --all; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
