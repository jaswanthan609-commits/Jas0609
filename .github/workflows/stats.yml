# Every Monday: views, watch hours and revenue per channel on the run's summary page. Also saves
# earnings since the autopilot started to ledger/revenue.json, which tops up the spending budget.
name: Weekly stats

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    if: ${{ vars.UPLOAD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write YouTube secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: python -m facepipe.ci
      - name: Report and save earnings for the budget
        run: |
          { echo '```'; python -m facepipe stats --all --save-revenue; python -m facepipe budget; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Save earnings to main
        run: |
          git config user.name "facepipe-bot"
          git config user.email "facepipe-bot@users.noreply.github.com"
          git add ledger/ 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "Earnings $(date -u +%Y-%m-%d) [skip ci]" && git pull --rebase -q origin main && git push; }
